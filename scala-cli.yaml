# ------------------------------------------------------------
# Scala CLI configuration for Scala 3.3.7
# Includes: Scalafmt (JVM), Scalafix, SemanticDB, test settings
# ------------------------------------------------------------

# --- Scala version ---
scala:
  version: 3.3.7

# --- Scalafmt configuration ---
# JVM mode avoids Windows Defender / AppLocker blocking scalafmt.exe
scalafmt:
  java: true
  config: .scalafmt.conf

# --- Scalafix configuration ---
scalafix:
  config: .scalafix.conf
  rules:
    - OrganizeImports
    - RemoveUnused

# --- Compiler options ---
compiler:
  options:
    # Enable SemanticDB (required for Scalafix semantic rules)
    - -Ysemanticdb
    # Recommended for better diagnostics
    - -Wunused:imports
    - -Wunused:all
    # Optional: stricter type inference
    - -source:future

# --- Test configuration ---
test:
  framework: munit
  options:
    # Show full stack traces
    - -Xprint-sources
    # Fail fast
    - -Xfatal-warnings

# --- JVM settings (optional but recommended) ---
java:
  options:
    - -Xmx2G
    - -Xms512M

# --- Project metadata (optional) ---
project:
  name: MoMo3
  description: "Scala 3.3.7 project with Scalafmt, Scalafix and SemanticDB"
